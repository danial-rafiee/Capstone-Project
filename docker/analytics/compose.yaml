# B's isolated local MySQL and optional B-only verification container.
name: smart-energy-b

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_energy_ha3
      MYSQL_USER: energy_app
      MYSQL_PASSWORD: ${SMART_ENERGY_DB_PASSWORD:?Set SMART_ENERGY_DB_PASSWORD in docker/analytics/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/analytics/.env}
      TZ: UTC
    ports:
      - "127.0.0.1:${SMART_ENERGY_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Use the group's existing schema without modifying any A/C table definition.
      - ../../sql/schema_ha3.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./20-demo-readings.sql:/docker-entrypoint-initdb.d/20-demo-readings.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" --batch --skip-column-names
          -e 'SELECT 1 FROM readings LIMIT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  b-check:
    profiles: [check]
    build:
      context: ../..
      dockerfile: docker/analytics/Dockerfile
    environment:
      SMART_ENERGY_DB_HOST: mysql
      SMART_ENERGY_DB_PORT: "3306"
      SMART_ENERGY_DB_NAME: smart_energy_ha3
      SMART_ENERGY_DB_USER: energy_app
      SMART_ENERGY_DB_PASSWORD: ${SMART_ENERGY_DB_PASSWORD:?Set SMART_ENERGY_DB_PASSWORD in docker/analytics/.env}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python -m pytest tests -q -p no:cacheprovider
        && python check_docker_database_b.py
        && python demo_capstone_b.py --mysql --schedule-demo
        && python demo_off_hours_b.py

volumes:
  mysql_data:
